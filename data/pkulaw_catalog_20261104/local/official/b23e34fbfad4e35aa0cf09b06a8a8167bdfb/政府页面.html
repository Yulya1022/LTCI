					$(function() {
					    let locationHref = ''
					    $('a').click(function(e) {
					        // 判断点击的是否是A标签
					        if (e.target.nodeName === 'A') {
					            locationHref = e.target.href
					        } else {
					            locationHref = $(e.target).parents('a').attr('href')
					        }

					                // 阻止冒泡

					                // 获取滚动条距顶部的距离
					                const winTop = $(window).scrollTop()

					                $('.dialog_mask').css({
					                    'top': winTop + 'px'
					                }).show()
					                // 禁止页面滚动
					                $('body').css({
					                    overflow: 'hidden'
					                })
					                // 显示弹窗
